name: Build And Release Installers

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      run_number: ${{ steps.metadata.outputs.run_number }}
      short_sha: ${{ steps.metadata.outputs.short_sha }}
      app_version: ${{ steps.metadata.outputs.app_version }}
      tag_name: ${{ steps.metadata.outputs.tag_name }}
      release_name: ${{ steps.metadata.outputs.release_name }}
      windows_msi_name: ${{ steps.metadata.outputs.windows_msi_name }}
      mac_arm64_dmg_name: ${{ steps.metadata.outputs.mac_arm64_dmg_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Compute build metadata
        id: metadata
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          # The version in desktop/Cargo.toml, or, once that is released, the
          # next patch after the newest release in its major.minor line.
          base_version="$(sed -n 's/^version = "\([0-9]*\.[0-9]*\.[0-9]*\)"$/\1/p' desktop/Cargo.toml | head -n 1)"
          if [[ -z "$base_version" ]]; then
            echo "No major.minor.patch version in desktop/Cargo.toml" >&2
            exit 1
          fi
          major_minor="${base_version%.*}"
          base_patch="${base_version##*.}"
          latest_patch="$(git ls-remote --tags origin "refs/tags/v$major_minor.*" |
            sed -n "s|.*refs/tags/v${major_minor//./\\.}\.\([0-9][0-9]*\)$|\1|p" | sort -n | tail -n 1)"
          if [[ -n "$latest_patch" && "$latest_patch" -ge "$base_patch" ]]; then
            app_version="$major_minor.$((latest_patch + 1))"
          else
            app_version="$base_version"
          fi
          tag_name="v$app_version"
          release_name="Cloud Drive Mount $app_version"
          windows_msi_name="CloudDriveMount-$app_version-windows-x64.msi"
          mac_arm64_dmg_name="CloudDriveMount-$app_version-macos-arm64.dmg"

          echo "run_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"
          echo "windows_msi_name=$windows_msi_name" >> "$GITHUB_OUTPUT"
          echo "mac_arm64_dmg_name=$mac_arm64_dmg_name" >> "$GITHUB_OUTPUT"

  build-installers:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            packager_format: dmg
            extension: dmg
          - name: windows-x64
            runner: windows-2022
            rust_target: x86_64-pc-windows-msvc
            packager_format: wix
            extension: msi
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Prepare rclone sidecar
        env:
          SIDECAR_TARGET_TRIPLE: ${{ matrix.rust_target }}
        run: bun run prepare:sidecars

      - name: Check Rust formatting
        working-directory: desktop
        run: cargo fmt --check

      - name: Run Rust clippy
        working-directory: desktop
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        working-directory: desktop
        run: cargo test --locked

      - name: Run script tests
        run: bun test tests

      - name: Set release version
        working-directory: desktop
        shell: bash
        run: |
          # Only the first `version =` line, the package's own.
          perl -0pi -e 's/^version = "[^"]*"/version = "${{ needs.metadata.outputs.app_version }}"/m' Cargo.toml
          grep -m1 '^version' Cargo.toml

      - name: Prepare Apple signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          # Releases are always Developer ID signed and notarized: no unsigned fallback.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_ISSUER APPLE_API_PRIVATE_KEY_BASE64; do
            if [[ -z "${!name}" ]]; then
              echo "Missing the $name secret, needed to sign and notarize the macOS app." >&2
              exit 1
            fi
          done
          key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build installer
        working-directory: desktop
        env:
          # cargo-packager imports the certificate into a temporary keychain,
          # signs with it, then notarizes and staples the app.
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
        # Each runner builds for its own architecture, so no --target.
        run: cargo packager --release --formats ${{ matrix.packager_format }}

      - name: Notarize the DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          scripts/notarize-dmg.sh
          rm -f "$APPLE_API_KEY_PATH"

      - name: Prepare release asset
        shell: bash
        run: |
          bundle_dir="desktop/target/release/bundle"
          case "${{ matrix.name }}" in
            macos-arm64) asset_name="${{ needs.metadata.outputs.mac_arm64_dmg_name }}" ;;
            windows-x64) asset_name="${{ needs.metadata.outputs.windows_msi_name }}" ;;
            *) echo "Unknown release matrix item: ${{ matrix.name }}" >&2; exit 1 ;;
          esac

          mkdir -p release
          bundles_file="$(mktemp)"
          find "$bundle_dir" -maxdepth 1 -type f -name '*.${{ matrix.extension }}' | sort > "$bundles_file"
          bundle_count="$(wc -l < "$bundles_file" | tr -d '[:space:]')"

          if [[ "$bundle_count" -ne 1 ]]; then
            echo "Expected exactly one .${{ matrix.extension }} bundle in $bundle_dir, found $bundle_count" >&2
            cat "$bundles_file" >&2
            exit 1
          fi

          bundle_path="$(sed -n '1p' "$bundles_file")"
          cp "$bundle_path" "release/$asset_name"
          ls -lh release

      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.name }}
          path: release/*.${{ matrix.extension }}
          if-no-files-found: error

  publish-release:
    needs:
      - metadata
      - build-installers
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: release
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          test -f "release/${{ needs.metadata.outputs.windows_msi_name }}"
          test -f "release/${{ needs.metadata.outputs.mac_arm64_dmg_name }}"
          find release -maxdepth 1 -type f -print | sort

      - name: Generate release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## ${{ needs.metadata.outputs.release_name }}

          Commit: `${{ github.sha }}`
          Branch: `${{ github.ref_name }}`
          GitHub Actions run: `#${{ needs.metadata.outputs.run_number }}`
          Published app version: `${{ needs.metadata.outputs.app_version }}`

          ### Assets
          - `${{ needs.metadata.outputs.windows_msi_name }}` - Windows x64 MSI. WinFsp must already be installed for mounting to work.
          - `${{ needs.metadata.outputs.mac_arm64_dmg_name }}` - macOS DMG for Apple Silicon Macs (Intel Macs are not supported).

          ### macOS
          The macOS app is signed with a Developer ID and notarized by Apple. Mounting needs FUSE-T (`brew install --cask fuse-t`).
          EOF

      - name: Upload workflow release bundle
        uses: actions/upload-artifact@v7
        with:
          name: CloudDriveMount-${{ needs.metadata.outputs.app_version }}-${{ needs.metadata.outputs.short_sha }}
          path: |
            release/*.dmg
            release/*.msi
            release-notes.md
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.metadata.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.metadata.outputs.release_name }}
          body_path: release-notes.md
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release/*.dmg
            release/*.msi
